name: Bootstrap Hono locks

on:
  push:
    branches:
      - security/hono-4.13.7-20261001

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/hono-4.13.7-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh root and MCP lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --prefix mcp --ignore-scripts
          if git diff --quiet -- package-lock.json mcp/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json mcp/package-lock.json
          git commit -m "security: refresh Hono lockfiles"
          git push origin HEAD:security/hono-4.13.7-20261001
