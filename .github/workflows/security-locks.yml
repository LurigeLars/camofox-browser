name: Security dependency lock verification
on:
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'mcp/package.json'
      - 'mcp/package-lock.json'
      - '.github/workflows/security-locks.yml'
  push:
    branches: [master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'mcp/package.json'
      - 'mcp/package-lock.json'
      - '.github/workflows/security-locks.yml'
permissions:
  contents: read
jobs:
  verify:
    name: npm ci / patched transitive dependencies (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'mcp']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Reproducible, no-postinstall dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dev-only deepmerge compatibility and prototype safety
        if: matrix.directory == '.'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const m = require('deepmerge');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(manifest.overrides.deepmerge, 'npm:@stackline/deepmerge@1.1.0');
          assert.equal(lock.packages['node_modules/deepmerge'].name, '@stackline/deepmerge');
          assert.equal(lock.packages['node_modules/deepmerge'].version, '1.1.0');
          assert.equal(lock.packages['node_modules/deepmerge'].dev, true, 'replacement is dev-only');
          assert.equal(lock.packages['node_modules/deepmerge'].hasInstallScript, undefined, 'no install hook');
          assert.match(lock.packages['node_modules/deepmerge'].integrity, /^sha512-/, 'registry integrity pinned');
          assert.equal(require('deepmerge/package.json').name, '@stackline/deepmerge', 'installed alias identity');
          assert.equal(typeof m, 'function', 'Jest expects CommonJS callable deepmerge');
          assert.deepEqual(m({ test: { a: 1 }, arr: [1] }, { test: { b: 2 }, arr: [2] }),
            { test: { a: 1, b: 2 }, arr: [1, 2] });
          const result = m({}, JSON.parse('{"__proto__":{"compromised":true},"valid":1}'));
          assert.equal(Object.getPrototypeOf(result), Object.prototype, 'reject attacker-defined prototype');
          assert.equal(Object.hasOwn(result, '__proto__'), false, 'reject unsafe source property');
          assert.equal(result.compromised, undefined);
          assert.equal(result.valid, 1);
          NODE
      - name: Verify patched dependency floor and lockfile integrity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const fixes = {
            '@hono/node-server': '2.1.8',
            'zod': '4.6.6',
            'body-parser': '2.4.0',
            'fast-uri': '3.1.9',
            'hono': '4.13.16',
            'ip-address': '10.7.5',
            'qs': '6.17.1',
          };
          for (const [name, version] of Object.entries(fixes)) {
            const entry = lock.packages[`node_modules/${name}`];
            assert.equal(entry?.version, version, `${name} lock`);
            assert.match(entry?.integrity ?? '', /^sha512-/);
            assert.equal(name === 'ip-address' && !manifest.overrides[name]
              ? manifest.overrides['express-rate-limit']?.['ip-address']
              : manifest.overrides[name], version, `${name} override`);
          }
          assert.equal(lock.packages['node_modules/body-parser/node_modules/content-type']?.version, '2.1.0');
          if (manifest.name === '@askjo/camofox-browser') {
            const securePatterns = { glob: '14.0.2', minimatch: '11.0.1', 'path-scurry': '3.0.0' };
            for (const [name, version] of Object.entries(securePatterns)) {
              assert.equal(manifest.overrides[name], version, `${name} override`);
              const paths = Object.entries(lock.packages).filter(([path]) =>
                path.endsWith('node_modules/' + name)
              );
              assert.ok(paths.length > 0, `${name} must be present`);
              for (const [path, entry] of paths) {
                assert.equal(entry.version, version, `${name} at ${path}`);
                assert.match(entry.integrity ?? '', /^sha512-/, `${name} integrity at ${path}`);
              }
            }
          }

          NODE
