name: Static analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: GitHub Actions / actionlint + immutable pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report runner ShellCheck version
        run: shellcheck --version

      - name: Install verified actionlint v1.7.12
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint -color

      - name: Require immutable GitHub Action pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r'^\s*(?:-\s*)?uses:\s*([^#\s]+)')
          violations = []
          for path in Path(".github/workflows").glob("*.y*ml"):
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = pattern.match(line)
                  if not match:
                      continue
                  ref = match.group(1)
                  if ref.startswith(("./", "docker://")) or ("/" not in ref and "@" not in ref):
                      continue
                  if "@" not in ref or not re.fullmatch(r"[0-9a-fA-F]{40}", ref.rsplit("@", 1)[-1]):
                      violations.append((path, lineno, ref))

          for path, lineno, ref in violations:
              print(f"::error file={path},line={lineno}::Action is not pinned to a 40-character commit SHA: {ref}")
          if violations:
              sys.exit(1)
          PY

  security-gate:
    name: security-gate
    if: always()
    needs: [workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all static analysis jobs to pass
        shell: bash
        env:
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          set -euo pipefail
          test "$WORKFLOWS_RESULT" = "success"
