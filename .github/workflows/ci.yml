name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Allow manual validation of security PRs when API-authored commits do not trigger pull_request workflows

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (TypeScript → JS)
        run: npm run build

      - name: Verify standalone MCP package
        run: npm run test:mcp

      - name: Audit standalone MCP package
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --omit=dev

      - name: Run unit + plugin tests (Jest)
        run: |
          npm install --no-save jest-junit
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPatterns='tests/unit|plugins' \
            --testPathIgnorePatterns='security\.test|tabRecycling\.test|cookies\.test|timeoutContinuation\.test|operationalFailures\.test|tabLifecycleContract\.test' \
            --forceExit
        env:
          CI: true


  windows-process-cleanup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Install Camoufox
        run: npm run fetch-bin
        env:
          # camoufox-js uses this for authenticated GitHub release lookups.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify and patch Camoufox Windows Juggler for Playwright 1.64
        shell: pwsh
        run: |
          $root = (& node --input-type=module -e "import { INSTALL_DIR } from 'camoufox-js/dist/pkgman.js'; console.log(INSTALL_DIR)").Trim()
          python scripts/compat/patch_juggler_976.py $root --expect-sha256 581d0aa10b1a1f3985ca273f6cdba12a478f359a6ee2975f62ba1ceb04c075fa
          if ($LASTEXITCODE -ne 0) { throw "Windows patched Camoufox SHA256 mismatch" }


      - name: Verify Windows process cleanup
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--experimental-vm-modules'
          npx jest --runInBand --forceExit tests/unit/windowsProcesses.test.js
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install Camoufox
        run: npm run fetch-bin
        env:
          # camoufox-js uses this for authenticated GitHub release lookups.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify and patch Camoufox Linux Juggler for Playwright 1.64
        run: |
          set -euo pipefail
          root=$(node --input-type=module -e "import { INSTALL_DIR } from 'camoufox-js/dist/pkgman.js'; console.log(INSTALL_DIR)")
          python3 scripts/compat/patch_juggler_976.py "$root" --expect-sha256 2bad253389292f3009f669401eb8bc3abd615fb7c4e7d9619865f6c75b5c50fa


      - name: Install browser system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run e2e + browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --config jest.config.e2e.cjs \
              --runInBand --forceExit
        env:
          CI: true

      - name: Run browser-dependent unit tests
        run: |
          xvfb-run --auto-servernum \
            node --experimental-vm-modules node_modules/.bin/jest \
              --testPathPatterns='tests/unit/(security|tabRecycling|cookies|timeoutContinuation|operationalFailures|tabLifecycleContract)\.test' \
              --runInBand --forceExit
        env:
          CI: true

  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save jest-junit

      - name: Install Camoufox
        run: npm run fetch-bin
        env:
          # camoufox-js uses this for authenticated GitHub release lookups.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify and patch Camoufox Windows Juggler for Playwright 1.64
        shell: pwsh
        run: |
          $root = (& node --input-type=module -e "import { INSTALL_DIR } from 'camoufox-js/dist/pkgman.js'; console.log(INSTALL_DIR)").Trim()
          python scripts/compat/patch_juggler_976.py $root --expect-sha256 581d0aa10b1a1f3985ca273f6cdba12a478f359a6ee2975f62ba1ceb04c075fa
          if ($LASTEXITCODE -ne 0) { throw "Windows patched Camoufox SHA256 mismatch" }


      - name: Run browser E2E tests
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--experimental-vm-modules'
          npx jest --config jest.config.e2e.cjs --runInBand --forceExit
        env:
          CI: true

  notify-agenthook:
    needs: [unit, windows-process-cleanup, e2e, windows-e2e]
    if: always()
    uses: ./.github/workflows/agenthook-notify.yml
    with:
      kind: ci
      results: ${{ toJson(needs) }}
    secrets: inherit
