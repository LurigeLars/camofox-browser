name: One-time Playwright 1.64.1 lock regeneration

on:
  push:
    branches:
      - feat/playwright164-reproducible-juggler-20261102
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Resolve registry integrity and lock without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exactly requested protocol client
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.dependencies['playwright-core']!=='1.64.1'||l.packages['node_modules/playwright-core'].version!=='1.64.1'||l.packages[''].dependencies['playwright-core']!=='1.64.1'||!l.packages['node_modules/playwright-core'].integrity?.startsWith('sha512-'))process.exit(1)"
      - name: Commit real npm-generated lockfile to this branch
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "lock: resolve exact Playwright 1.64.1 from npm registry"
          git push origin "HEAD:feat/playwright164-reproducible-juggler-20261102"
