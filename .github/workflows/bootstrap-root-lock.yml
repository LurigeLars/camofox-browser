name: Bootstrap root lock

on:
  push:
    branches:
      - security/root-transitive-advisories-20260930

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/root-transitive-advisories-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh root lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh root lockfile"
          git push origin HEAD:security/root-transitive-advisories-20260930
