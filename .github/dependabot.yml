version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    # The patched Camoufox browser speaks the Playwright 1.64 protocol; 1.65 breaks
    # Browser.setDownloadOptions. Keep 1.64.x patches until Camoufox supports newer.
    ignore:
      - dependency-name: "playwright-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      root-npm:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "camoufox-js"
        update-types:
          - "minor"
          - "patch"

      # Security alerts are not covered by the root-npm version-update group.
      # Keep breaking major fixes and Camoufox browser-engine bumps separate.
      root-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "camoufox-js"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:05"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      mcp-npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

      # Consolidate related MCP security alerts independently of version PRs.
      mcp-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
