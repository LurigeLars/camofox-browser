version: 2

# One weekly pull request for all version updates (every ecosystem), so the
# strict up-to-date branch rule needs a single CI run. Security updates are
# not part of this group and still open immediately.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: saturday
      time: "07:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    # The patched Camoufox browser speaks the Playwright 1.64 protocol; 1.65 breaks
    # Browser.setDownloadOptions. Keep 1.64.x patches until Camoufox supports newer.
    ignore:
      - dependency-name: "playwright-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:

      # Security alerts are not covered by the root-npm version-update group.
      # Keep breaking major fixes and Camoufox browser-engine bumps separate.
      root-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - "camoufox-js"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/mcp"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:

      # Consolidate related MCP security alerts independently of version PRs.
      mcp-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: weekly-dependencies
    patterns: ["*"]
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
